<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NETLIFE: HK - teacher page</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f2; --fg: #1d1f24; --mute: #6b6f7a; --line: #dcdcd4; --chip: #ececE6; --bad: #b3322a; --good: #2a7a46; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --fg: #e8e8ee; --mute: #8a90a0; --line: #2a2e38; --chip: #222631; --bad: #ff7a6a; --good: #6ad08a; } }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 18px 24px 8px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .mute { color: var(--mute); }
  main { padding: 0 24px 40px; overflow-x: auto; }
  table { border-collapse: collapse; min-width: 980px; width: 100%; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--mute); cursor: pointer; user-select: none; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .bar { display: inline-block; height: 6px; background: var(--good); border-radius: 3px; vertical-align: middle; }
  .chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 5px; margin: 0 3px 3px 0; font-size: 12px; }
  .bad { color: var(--bad); }
  button { font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; margin: 0 3px 3px 0; }
  form { display: flex; gap: 8px; align-items: center; }
  form[hidden] { display: none; }
  input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  .topics { display: grid; grid-template-columns: repeat(9, 22px); gap: 2px; }
  .topics span { font-size: 10px; text-align: center; border-radius: 3px; padding: 1px 0; }
</style>
</head>
<body>
<header>
  <h1>NETLIFE: HK - teacher page</h1>
  <span class="mute" id="summary"></span>
  <form id="keyform" hidden><label>admin key <input id="key" type="password" autocomplete="current-password"></label><button>open</button></form>
</header>
<main><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const TOPICS = ['J1', 'J2', 'J3', 'J4', 'A', 'B', 'C', 'D', 'E'];
const COLS = [
  ['name', 'player'], ['worth', 'wealth'], ['rep', 'reputation'], ['earned', 'earned'], ['acc', 'accuracy'], ['mastery', 'mastery by topic'],
  ['record', 'record'], ['seen', 'last seen'], ['', ''],
];
let key = sessionStorage.getItem('cit-admin') || new URLSearchParams(location.search).get('key') || '';
let sort = 'worth', dir = -1, players = [];
const $ = (id) => document.getElementById(id);
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 2 ? 'now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
const base = location.pathname.replace(/admin\/?$/, '');

async function api(path, body) {
  const r = await fetch(base + 'api/admin/' + path, { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': key, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (r.status === 403) { sessionStorage.removeItem('cit-admin'); $('keyform').hidden = false; throw new Error(j.err); }
  if (!r.ok) { alert(j.err || 'failed'); throw new Error(j.err); }
  return j;
}

function render() {
  $('head').innerHTML = COLS.map(([k, label]) => `<th data-k="${k}">${label}${sort === k ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('');
  const val = (p) => sort === 'acc' ? (p.answered ? p.right / p.answered : 0) : sort === 'record' ? p.record.length : sort === 'mastery' ? TOPICS.reduce((a, t) => a + p.mastery[t], 0) : p[sort];
  const list = [...players].sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  $('rows').innerHTML = list.map((p) => {
    const acc = p.answered ? Math.round(100 * p.right / p.answered) : 0;
    const mast = TOPICS.map((t) => { const m = p.mastery[t]; return `<span title="${t}: ${m}" style="background: rgba(42,122,70,${0.08 + m / 120})">${t}</span>`; }).join('');
    const rec = p.record.length ? p.record.map((r) => `<span class="chip bad" title="${esc(r.id)}">${new Date(r.at).toLocaleDateString('en-GB')} ${r.jailed ? 'prison' : 'warning'}</span>`).join('') : '<span class="mute">clean</span>';
    return `<tr>
      <td><span class="dot" style="background:${p.coat}"></span><b>${esc(p.name)}</b>${p.online ? ' <span class="chip">online</span>' : ''}${p.paused ? ' <span class="chip bad">paused</span>' : ''}${p.jailed ? ' <span class="chip bad">in prison</span>' : ''}
        <div class="mute">${esc(p.cls || 'no class')}${p.work ? ' - works at ' + esc(p.work) : ''}${p.certs.length ? ' - ' + p.certs.length + ' exam' + (p.certs.length > 1 ? 's' : '') : ''}</div></td>
      <td class="num">${money(p.worth)}</td>
      <td class="num">${p.rep}</td>
      <td class="num">${money(p.earned)}<div class="mute">${money(p.spent)} living</div></td>
      <td class="num">${acc}%<div class="mute">${p.right}/${p.answered}</div></td>
      <td><div class="topics">${mast}</div></td>
      <td>${rec}</td>
      <td class="mute">${ago(p.seen)}</td>
      <td><button data-a="rename" data-id="${p.id}">rename</button><button data-a="class" data-id="${p.id}">class</button><button data-a="pause" data-id="${p.id}" data-on="${p.paused ? 0 : 1}">${p.paused ? 'unpause' : 'pause'}</button><button data-a="reset" data-id="${p.id}">reset</button></td>
    </tr>`;
  }).join('');
  const on = players.filter((p) => p.online).length;
  $('summary').textContent = `${players.length} players, ${on} online now`;
}

async function load() {
  try { players = await api('players'); render(); } catch (e) { /* key form shown */ }
}

$('head').addEventListener('click', (e) => { const k = e.target.dataset.k; if (!k) return; if (sort === k) dir = -dir; else { sort = k; dir = -1; } render(); });
$('rows').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const p = players.find((x) => x.id === b.dataset.id); if (!p) return;
  if (b.dataset.a === 'rename') { const name = prompt(`new name for ${p.name} (3-12 letters, digits, spaces)`, p.name); if (!name) return; await api('rename', { id: p.id, name }); }
  if (b.dataset.a === 'class') { const cls = prompt(`class and number for ${p.name} (like 5C01)`, p.cls); if (!cls) return; await api('class', { id: p.id, cls }); }
  if (b.dataset.a === 'pause') await api('pause', { id: p.id, paused: b.dataset.on === '1' });
  if (b.dataset.a === 'reset') { if (!confirm(`reset ${p.name}? their money, reputation, exams and job go back to the start. this cannot be undone.`)) return; await api('reset', { id: p.id }); }
  load();
});
$('keyform').addEventListener('submit', (e) => { e.preventDefault(); key = $('key').value; sessionStorage.setItem('cit-admin', key); $('keyform').hidden = true; load(); });

if (!key) $('keyform').hidden = false; else { sessionStorage.setItem('cit-admin', key); load(); }
setInterval(load, 15000);
</script>
</body>
</html>
