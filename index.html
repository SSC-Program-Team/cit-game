<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>NETLIFE: HK — Tung Tau Wan Road</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d16;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<script>
window.addEventListener('error', e => { document.title = 'ERR: ' + (e.message || 'unknown'); });
window.addEventListener('unhandledrejection', e => { document.title = 'REJ: ' + (e.reason && e.reason.message || e.reason); });
</script><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
